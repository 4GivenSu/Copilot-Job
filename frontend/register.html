<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f2f5;
      font-family: Arial, sans-serif;
    }
    .card {
      background: #fff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 420px;
    }
    h1 { text-align: center; margin-bottom: 1.5rem; font-size: 1.6rem; color: #333; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.3rem; font-size: 0.9rem; color: #555; }
    input {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #4a90e2; }
    .row { display: flex; gap: 0.5rem; }
    .row input { flex: 1; }
    button {
      padding: 0.6rem 1rem;
      border: none;
      border-radius: 4px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary {
      width: 100%;
      background: #4a90e2;
      color: #fff;
      margin-top: 0.5rem;
    }
    .btn-primary:hover { background: #357abd; }
    .btn-secondary {
      white-space: nowrap;
      background: #e8f0fe;
      color: #4a90e2;
    }
    .btn-secondary:hover { background: #d0e2ff; }
    .btn-secondary:disabled { opacity: 0.5; cursor: default; }
    .message {
      margin-top: 1rem;
      padding: 0.7rem;
      border-radius: 4px;
      font-size: 0.9rem;
      display: none;
    }
    .message.success { background: #e6f4ea; color: #2d7a3a; }
    .message.error   { background: #fdecea; color: #c62828; }
    .footer { text-align: center; margin-top: 1rem; font-size: 0.9rem; }
    .footer a { color: #4a90e2; text-decoration: none; }
  </style>
</head>
<body>
<div class="card">
  <h1>Create Account</h1>

  <div class="form-group">
    <label for="email">Email</label>
    <div class="row">
      <input type="email" id="email" placeholder="you@example.com" />
      <button class="btn-secondary" id="sendCodeBtn" onclick="sendCode()">Send Code</button>
    </div>
  </div>

  <div class="form-group">
    <label for="code">Verification Code</label>
    <input type="text" id="code" placeholder="6-digit code" maxlength="6" />
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="At least 8 characters" />
  </div>

  <button class="btn-primary" onclick="register()">Register</button>

  <div class="message" id="msg"></div>

  <div class="footer">Already have an account? <a href="login.html">Log in</a></div>
</div>

<script>
  const BASE = '';  // same origin; update if backend runs on a different port

  function showMessage(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'message ' + type;
    el.style.display = 'block';
  }

  async function sendCode() {
    const email = document.getElementById('email').value.trim();
    if (!email) { showMessage('Please enter your email first.', 'error'); return; }

    const btn = document.getElementById('sendCodeBtn');
    btn.disabled = true;
    btn.textContent = 'Sending…';

    try {
      const res = await fetch(`${BASE}/auth/send-code`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      const data = await res.json();
      if (!res.ok) {
        showMessage(data.detail || 'Failed to send code.', 'error');
      } else {
        showMessage(data.message, 'success');
        // Start 60-second cooldown
        let secs = 60;
        const timer = setInterval(() => {
          btn.textContent = `Resend (${--secs}s)`;
          if (secs <= 0) { clearInterval(timer); btn.disabled = false; btn.textContent = 'Send Code'; }
        }, 1000);
      }
    } catch (e) {
      showMessage('Network error. Please try again.', 'error');
      btn.disabled = false;
      btn.textContent = 'Send Code';
    }
  }

  async function register() {
    const email    = document.getElementById('email').value.trim();
    const code     = document.getElementById('code').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !code || !password) {
      showMessage('All fields are required.', 'error');
      return;
    }

    try {
      const res = await fetch(`${BASE}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, code, password }),
      });
      const data = await res.json();
      if (!res.ok) {
        showMessage(data.detail || 'Registration failed.', 'error');
      } else {
        showMessage('Registration successful! Redirecting to login…', 'success');
        setTimeout(() => { window.location.href = 'login.html'; }, 2000);
      }
    } catch (e) {
      showMessage('Network error. Please try again.', 'error');
    }
  }
</script>
</body>
</html>
